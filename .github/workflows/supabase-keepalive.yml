name: Supabase keep-alive

'on':
  workflow_dispatch: {}
  schedule:
    - cron: '23 4 1,4,7,10,13,16,19,22,25,28 * *'

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Call the ping function
        shell: bash
        env:
          PING_URL: ${{ secrets.SUPABASE_PING_URL }}
          APIKEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: curl -fsS "$PING_URL" -H "apikey: $APIKEY"
