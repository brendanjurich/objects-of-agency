name: Supabase keep-alive
# Free-tier projects pause after 7 days without an API request. Three-day cadence keeps it warm.
on:
  schedule:
    - cron: "23 4 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.SUPABASE_PING_URL }}" -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
