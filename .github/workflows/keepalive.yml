name: Supabase keep-alive
# Free-tier projects pause after 7 days without an API request; every third day keeps it warm.
# No headers: the ping function is deployed with JWT verification off. GitHub refuses to
# register a workflow file that contains an API-key-style header string (bisected 09-09-2026).
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 1,4,7,10,13,16,19,22,25,28 * *'
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "https://nleekoypvxoagnwiqtzz.supabase.co/functions/v1/ping"
