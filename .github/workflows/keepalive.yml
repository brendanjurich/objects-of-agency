name: Supabase keep-alive
# Free-tier projects pause after 7 days without an API request; every third day keeps it warm.
# The URL and the publishable key are public by design (the same key ships in the browser).
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 1,4,7,10,13,16,19,22,25,28 * *'
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "https://nleekoypvxoagnwiqtzz.supabase.co/functions/v1/ping" -H "apikey: sb_publishable_FGXZjb4nFgynlvd1pyuoEA_KkbfXed8"
